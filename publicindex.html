<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF0033" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>REDY GO — Знайди свою людину</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F4F5F7;
    }
    .btn-spring {
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    .btn-spring:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="font-sans text-black antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [phone, setPhone] = useState('');
      const [activeTab, setActiveTab] = useState('radar');
      const [likesCount, setLikesCount] = useState(5);
      const [loadingPay, setLoadingPay] = useState(false);
      const [loadingAuth, setLoadingAuth] = useState(false);

      useEffect(() => {
        const storedUserId = localStorage.getItem('redy_user_id');
        if (storedUserId) {
          checkProfile(storedUserId);
        }
      }, []);

      const checkProfile = async (id) => {
        try {
          const res = await fetch(`/api/profile/${id}`);
          if (res.ok) {
            const data = await res.json();
            setUser(data);
            updateLikes(data.id);
          } else {
            localStorage.removeItem('redy_user_id');
          }
        } catch (err) {
          console.error('Помилка профілю:', err);
        }
      };

      const updateLikes = async (id) => {
        try {
          const res = await fetch(`/api/likes/${id}`);
          if (res.ok) {
            const data = await res.json();
            setLikesCount(data.count || 5);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        if (!phone || phone.trim().length < 10) {
          alert('Будь ласка, введіть коректний номер телефону');
          return;
        }
        setLoadingAuth(true);
        try {
          const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone }),
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data);
            localStorage.setItem('redy_user_id', data.id);
            updateLikes(data.id);
          } else {
            alert('Помилка авторизації. Спробуйте ще раз.');
          }
        } catch (err) {
          alert('Помилка з\'єднання з сервером');
        } finally {
          setLoadingAuth(false);
        }
      };

      const handlePay = async () => {
        if (!user) return;
        setLoadingPay(true);
        try {
          const res = await fetch('/api/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id }),
          });
          const data = await res.json();
          if (res.ok && data.url) {
            window.location.href = data.url;
          } else {
            alert(data.error || 'Помилка створення платежу');
          }
        } catch (err) {
          alert('Не вдалося підключитися до платіжної системи');
        } finally {
          setLoadingPay(false);
        }
      };

      if (!user) {
        return (
          <div class="flex flex-col justify-center items-center min-h-screen px-6 bg-[#F4F5F7]">
            <div class="w-full max-w-sm text-center mb-8">
              <h1 class="text-4xl font-black tracking-tighter mb-2"><span class="text-[#FF0033]">REDY</span> GO</h1>
              <p class="text-gray-500 font-semibold text-sm">Швидкі побачення твого міста</p>
            </div>
            <div class="w-full max-w-sm bg-white p-6 rounded-[32px] shadow-sm border border-gray-100">
              <form onSubmit={handleAuth} class="space-y-4">
                <div>
                  <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Твій номер телефону</label>
                  <input 
                    type="tel" 
                    value={phone} 
                    onChange={e => setPhone(e.target.value)}
                    placeholder="+380" 
                    class="w-full p-4 bg-[#F4F5F7] rounded-2xl font-bold text-lg outline-none border-2 border-transparent focus:border-[#FF0033] transition-all"
                  />
                </div>
                <button 
                  type="submit" 
                  disabled={loadingAuth}
                  class="w-full bg-[#FF0033] text-white p-4 rounded-2xl font-black text-md btn-spring shadow-lg shadow-[#FF0033]/10"
                >
                  {loadingAuth ? 'ВХІД...' : 'GO (УВІЙТИ В КЛУБ)'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="flex flex-col h-screen max-w-md mx-auto bg-[#F4F5F7] shadow-2xl relative">
          {/* Header */}
          <header class="bg-white/90 backdrop-blur-md p-4 flex justify-between items-center border-b border-gray-100 sticky top-0 z-40">
            <h2 class="text-2xl font-black tracking-tighter"><span class="text-[#FF0033]">REDY</span> GO</h2>
            <div class="flex items-center space-x-2">
              <span class={`px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${user.is_premium ? 'bg-green-100 text-green-600' : 'bg-red-50 text-[#FF0033]'}`}>
                {user.is_premium ? '👑 PREMIUM' : 'БАЗОВИЙ'}
              </span>
            </div>
          </header>

          {/* Feed Container */}
          <main class="flex-1 overflow-y-auto p-4 pb-24">
            {activeTab === 'radar' && (
              <div class="space-y-4">
                <div class="bg-white p-4 rounded-[32px] shadow-sm border border-gray-50 relative">
                  <div class="aspect-[3/4] w-full rounded-[24px] bg-gray-100 relative overflow-hidden mb-4 shadow-inner">
                    <img 
                      src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=600" 
                      class={`w-full h-full object-cover transition-all duration-500 ${user.is_premium ? '' : 'blur-2xl scale-105'}`}
                    />
                    {!user.is_premium && (
                      <div class="absolute inset-0 bg-black/5 flex items-center justify-center p-4">
                        <span class="bg-white/90 text-black text-xs font-extrabold px-4 py-2 rounded-full shadow-md tracking-wide">АНКЕТУ ЗАБЛОКОВАНО</span>
                      </div>
                    )}
                  </div>
                  <div class="mb-4 px-1">
                    <h3 class="text-2xl font-black">Марта, 21</h3>
                    <p class="text-gray-400 font-semibold text-sm">Поруч з тобою • Хотіла б сходити на каву</p>
                  </div>
                  
                  {!user.is_premium ? (
                    <button 
                      onClick={handlePay} 
                      disabled={loadingPay}
                      class="w-full bg-[#FF0033] text-white py-4 rounded-2xl font-black text-lg btn-spring shadow-lg shadow-[#FF0033]/10"
                    >
                      {loadingPay ? 'ОБРОБКА...' : 'ВІДКРИТИ ПРОФІЛЬ'}
                    </button>
                  ) : (
                    <button class="w-full bg-black text-white py-4 rounded-2xl font-black text-lg btn-spring">
                      НАПИСАТИ В ТЕЛЕГРАМ
                    </button>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'likes' && (
              <div class="h-full flex flex-col justify-between space-y-6">
                <div class="grid grid-cols-2 gap-3">
                  {[...Array(likesCount)].map((_, i) => (
                    <div key={i} class="bg-white p-3 rounded-[24px] shadow-sm border border-gray-50 flex flex-col items-center">
                      <div class="w-20 h-20 rounded-full bg-gray-200 overflow-hidden mb-2 relative">
                        <img 
                          src={`https://images.unsplash.com/photo-${1500000000000 + (i * 100000)}?q=80&w=150`} 
                          class={`w-full h-full object-cover ${user.is_premium ? '' : 'blur-xl scale-110'}`} 
                        />
                      </div>
                      <div class="h-3 w-16 bg-gray-100 rounded-full"></div>
                    </div>
                  ))}
                </div>

                {!user.is_premium && (
                  <div class="bg-white p-6 rounded-[32px] shadow-sm border-2 border-[#FF0033]/10 text-center space-y-4">
                    <div class="inline-flex items-center justify-center bg-red-50 w-16 h-16 rounded-full text-3xl font-black text-[#FF0033]">
                      {likesCount}
                    </div>
                    <div>
                      <h4 class="text-xl font-black mb-1">Тебе лайкнули дівчата!</h4>
                      <p class="text-gray-400 font-semibold text-sm px-4">Оформи доступ, щоб відкрити анкети та моментально почати чат.</p>
                    </div>
                    <button 
                      onClick={handlePay} 
                      disabled={loadingPay}
                      class="w-full bg-[#FF0033] text-white py-4 rounded-2xl font-black text-lg btn-spring shadow-lg shadow-[#FF0033]/20"
                    >
                      {loadingPay ? 'ОБРОБКА...' : 'GO (УВІЙТИ В КЛУБ)'}
                    </button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chats' && (
              <div class="flex flex-col items-center justify-center py-20 text-center px-6">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm text-2xl">💬</div>
                <p class="text-gray-400 font-bold text-sm max-w-xs leading-relaxed">
                  {user.is_premium 
                    ? 'У тебе поки немає активних діалогів. Перейди в Радар, щоб знайти пару!' 
                    : 'У тебе поки немає активних діалогів. Активуй преміум, щоб написати першим.'}
                </p>
                {!user.is_premium && (
                  <button onClick={handlePay} class="mt-4 text-[#FF0033] font-black text-sm underline decoration-2">
                    Активувати преміум-доступ
                  </button>
                )}
              </div>
            )}
          </main>

          {/* Navigation */}
          <nav class="absolute bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-gray-100 flex justify-around p-3 z-40">
            <button 
              onClick={() => setActiveTab('radar')} 
              class={`flex flex-col items-center p-2 font-black text-[11px] uppercase tracking-wider transition-all ${activeTab === 'radar' ? 'text-[#FF0033] scale-105' : 'text-gray-300'}`}
            >
              <span class="text-xl mb-1">🎯</span> Радар
            </button>
            <button 
              onClick={() => setActiveTab('likes')} 
              class={`flex flex-col items-center p-2 font-black text-[11px] uppercase tracking-wider transition-all relative ${activeTab === 'likes' ? 'text-[#FF0033] scale-105' : 'text-gray-300'}`}
            >
              <span class="text-xl mb-1">❤️</span> Лайки
              {!user.is_premium && (
                <span class="absolute top-1 right-1 bg-[#FF0033] text-white text-[9px] px-1.5 py-0.5 rounded-full font-black animate-pulse">
                  {likesCount}
                </span>
              )}
            </button>
            <button 
              onClick={() => setActiveTab('chats')} 
              class={`flex flex-col items-center p-2 font-black text-[11px] uppercase tracking-wider transition-all ${activeTab === 'chats' ? 'text-[#FF0033] scale-105' : 'text-gray-300'}`}
            >
              <span class="text-xl mb-1">💬</span> Чати
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
