<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDY GO — Клуб Знайомств</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* Глубокий темный фон с легким радиальным красным свечением сверху */
        body { 
            background-color: #000000; 
            color: #FFFFFF; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #140103 0%, #000000 65%);
        }
        
        /* Основная карточка интерфейса */
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            text-align: center;
        }

        /* Блок логотипов */
        .logo-box {
            margin-bottom: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* Инвертируем черный цвет оригиналов в белый + сохраняем красный + добавляем неоновое свечение */
        .logo-icon {
            max-width: 95px;
            height: auto;
            display: block;
            filter: invert(1) hue-rotate(180deg) brightness(1.1) drop-shadow(0 0 25px rgba(229, 0, 39, 0.4));
        }

        .logo-text {
            max-width: 230px;
            height: auto;
            display: block;
            filter: invert(1) hue-rotate(180deg) brightness(1.2) drop-shadow(0 0 15px rgba(229, 0, 39, 0.25));
        }
        
        .logo-subtitle { 
            font-size: 11px; 
            letter-spacing: 5px; 
            color: #E50027; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(229, 0, 39, 0.5);
        }

        /* Управление экранами */
        .screen { display: none; width: 100%; }
        .screen.active { display: block; animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h2 { 
            font-size: 12px; 
            text-transform: uppercase; 
            color: #E50027; 
            letter-spacing: 2px; 
            margin-bottom: 18px; 
            font-weight: 800; 
        }
        
        .input-container {
            position: relative;
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            text-align: left;
            padding-left: 4px;
        }
        
        /* Поле ввода телефона */
        input[type="tel"] {
            width: 100%; 
            background: #070707; 
            border: 1px solid #1a1a1a; 
            padding: 18px; 
            border-radius: 14px;
            color: #fff; 
            font-size: 18px; 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            transition: all 0.3s ease;
            outline: none; 
            text-align: center;
        }
        input[type="tel"]:focus { 
            border-color: #E50027; 
            box-shadow: 0 0 25px rgba(225, 0, 39, 0.25); 
            background: #0d0d0d;
        }

        /* Кнопка GO */
        .btn {
            width: 100%; 
            background: #E50027; 
            color: #fff; 
            border: none; 
            padding: 19px; 
            border-radius: 14px;
            font-size: 14px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2.5px; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 6px 25px rgba(225, 0, 39, 0.4);
        }
        .btn:not(:disabled):hover { 
            background: #ff0b34; 
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(225, 0, 39, 0.6);
        }
        .btn:disabled { background: #222; color: #555; box-shadow: none; cursor: not-allowed; }

        .hint-box {
            font-size: 11px;
            color: #444;
            margin-top: 25px;
            line-height: 1.6;
            border-top: 1px solid #111;
            padding-top: 15px;
        }
        .hint-box span { color: #00cc66; font-weight: 600; }

        /* Элементы загрузчика */
        .loader-box { padding: 10px 0; }
        .spinner {
            width: 45px; height: 45px; border: 3px solid #111; border-top: 3px solid #E50027;
            border-radius: 50%; margin: 0 auto 25px auto; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 17px; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
        .sub-text { font-size: 13px; color: #666; margin-bottom: 30px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="logo-box">
            <img src="/logo-mark.png" alt="RG" class="logo-icon">
            <img src="/logo-text.png" alt="REDY GO" class="logo-text">
            <div class="logo-subtitle">Клуб знайомств · 18+</div>
        </div>

        <div id="screen-login" class="screen active">
            <h2>Ваш Вхід</h2>
            <div class="input-container">
                <span class="input-label">Номер телефону</span>
                <input type="tel" id="phone-input" placeholder="+380 97 757 0986" value="+380">
            </div>
            <button id="go-btn" class="btn" onclick="handleLogin()">GO – УВІЙТИ В КЛУБ</button>
            
            <div class="hint-box">
                Безпечно та анонімно.<br>
                <span>●</span> Верифікація без SMS · Тільки Telegram або Viber
            </div>
        </div>

        <div id="screen-wait" class="screen">
            <div class="loader-box">
                <div class="spinner"></div>
                <div class="status-text">Очікуємо підтвердження...</div>
                <div class="sub-text">Поділіться своїм номером у нашому Telegram-боті для миттєвого безпечного входу.</div>
                <button id="tg-link-btn" class="btn" style="background:#0088cc; box-shadow:0 5px 25px rgba(0,136,204,0.4);" onclick="openTelegram()">ПІДТВЕРДИТИ В TELEGRAM</button>
            </div>
        </div>

    </div>

    <script>
        let currentToken = '';
        let pollingInterval = null;

        async function handleLogin() {
            const phoneInput = document.getElementById('phone-input').value;
            const goBtn = document.getElementById('go-btn');
            
            if(!phoneInput || phoneInput.length < 9) {
                alert('Будь ласка, введіть коректний номер телефону');
                return;
            }

            goBtn.disabled = true;
            goBtn.innerText = 'ОБРОБКА...';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneInput })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    currentToken = data.token;
                    
                    document.getElementById('screen-login').classList.remove('active');
                    document.getElementById('screen-wait').classList.add('active');
                    
                    startStatusPolling(currentToken);
                } else {
                    alert('Помилка: ' + (data.error || 'Невідома помилка сервера'));
                    resetButton(goBtn);
                }
            } catch (err) {
                console.error(err);
                alert('Не вдалося зв’язатися з сервером. Перевірте логи Railway.');
                resetButton(goBtn);
            }
        }

        function resetButton(btn) {
            btn.disabled = false;
            btn.innerText = 'GO – УВІЙТИ В КЛУБ';
        }

        function openTelegram() {
            if(!currentToken) return;
            window.location.href = `https://t.me/redy_go_bot?start=auth_${currentToken}`;
        }

        function startStatusPolling(token) {
            pollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/auth-status?token=${token}`);
                    const data = await res.json();
                    
                    if (data.status === 'verified') {
                        clearInterval(pollingInterval);
                        alert('✅ Верифікація успішна!');
                    }
                } catch (err) {
                    console.error(err);
                }
            }, 2000);
        }
    </script>
</body>
</html>
