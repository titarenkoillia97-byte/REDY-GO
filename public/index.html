<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyGo Club | Exclusive</title>
    <style>
        :root { --accent: #E50027; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .card { width: 90%; max-width: 380px; text-align: center; }
        
        /* Крутой блок с логотипами */
        .logo-container { margin-bottom: 3rem; }
        .logo-container img { display: block; margin: 0 auto; filter: brightness(0) invert(1); width: 180px; }
        .logo-container .mark { width: 80px; margin-bottom: 15px; }

        h1 { font-size: 1.2rem; margin-bottom: 2rem; color: #777; letter-spacing: 2px; text-transform: uppercase; }
        
        input { width: 100%; background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px; color: white; font-size: 1.1rem; text-align: center; margin-bottom: 15px; outline: none; transition: .3s; }
        input:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 18px; border: none; border-radius: 12px; background: var(--accent); color: white; font-weight: bold; font-size: 1rem; text-transform: uppercase; cursor: pointer; transition: .3s; }
        button:hover { background: #ff0b34; box-shadow: 0 0 20px rgba(229, 0, 39, 0.4); }

        .loader { display: none; font-size: 0.9rem; color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="/logo-mark.png" class="mark" alt="Logo">
            <img src="/logo-text.png" alt="ReadyGo">
        </div>
        
        <div id="auth-form">
            <input type="tel" id="phone" value="+380">
            <button onclick="login()">Увійти в ReadyGo</button>
        </div>
        
        <div id="loader" class="loader">Чекаємо підтвердження у боті @ReadyGoClubBot...</div>
    </div>

    <script>
        async function login() {
            const phone = document.getElementById('phone').value;
            const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone}) });
            const data = await res.json();
            if(data.success) {
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                window.location.href = `https://t.me/ReadyGoClubBot?start=${data.token}`;
            }
        }
    </script>
</body>
</html>
