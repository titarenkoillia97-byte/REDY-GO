<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDY GO - Твій Рух Сьогодні</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F4F5F7; color: #000000; font-family: 'Inter', sans-serif; }
        .redy-btn { background-color: #FF0033; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('radar');
            const [user, setUser] = React.useState({ id: 1, is_premium: false });
            const [cards] = React.useState([
                { id: 2, name: "Каріна", age: 21, city: "Київ", photo_url: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500", status: "Вільна після 20:00, хочу на кальян 💨" },
                { id: 3, name: "Аліна", age: 23, city: "Дніпро", photo_url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500", status: "Шукаю компанію для вечері прямо зараз 🥂" }
            ]);

            const handlePayment = async () => {
                try {
                    const response = await fetch('/api/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: user.id })
                    });
                    const data = await response.json();
                    if (data.url) window.location.href = data.url;
                } catch (e) {
                    alert("Помилка платіжки. Спробуйте пізніше.");
                }
            };

            return (
                <div class="max-w-md mx-auto h-screen flex flex-col justify-between bg-[#F4F5F7] relative overflow-hidden">
                    <header class="flex justify-between items-center py-5 px-6 bg-white rounded-b-[32px] shadow-sm z-10">
                        <h1 class="text-3xl font-black tracking-tight"><span class="text-[#FF0033]">REDY</span> GO</h1>
                        <span class="text-[10px] bg-gray-100 text-gray-800 px-3 py-1.5 rounded-full font-bold uppercase tracking-widest">Україна</span>
                    </header>

                    {activeTab === 'radar' && (
                        <div class="flex-1 flex flex-col justify-center items-center p-4">
                            {cards.map((card) => (
                                <div key={card.id} class="w-full bg-white rounded-[32px] overflow-hidden shadow-xl shadow-gray-200/50 relative mb-6">
                                    <img src={card.photo_url} class={`w-full h-[400px] object-cover ${!user.is_premium ? 'blur-2xl scale-110' : ''}`} />
                                    <div class="p-6 absolute bottom-0 left-0 w-full glass-panel border-t border-white/20">
                                        <h2 class="text-3xl font-black text-black tracking-tight">{card.name}, {card.age}</h2>
                                        <p class="text-sm text-gray-500 mt-1 font-semibold">{card.city}</p>
                                        <div class="mt-3 bg-gray-100 rounded-2xl p-3">
                                            <p class="text-sm text-black font-medium">{card.status}</p>
                                        </div>
                                        {!user.is_premium && (
                                            <button onClick={handlePayment} class="w-full mt-4 redy-btn text-white font-black py-4 rounded-[20px] shadow-lg shadow-red-500/30 text-lg">
                                                ВІДКРИТИ ПРОФІЛЬ
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {activeTab === 'likes' && (
                        <div class="flex-1 flex flex-col justify-center items-center relative px-4">
                            <div class="grid grid-cols-2 gap-4 w-full opacity-40 blur-md pointer-events-none px-2">
                                <div class="bg-white h-48 rounded-[32px]"></div>
                                <div class="bg-white h-48 rounded-[32px]"></div>
                            </div>
                            <div class="absolute bg-white rounded-[40px] p-8 text-center w-11/12 shadow-2xl shadow-gray-300">
                                <div class="bg-[#FF0033]/10 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <span class="text-4xl">🔥</span>
                                </div>
                                <h3 class="text-2xl font-black tracking-tight text-black">Тобі поставили лайк!</h3>
                                <p class="text-gray-500 text-sm mt-3 font-medium">5 дівчат поруч готові до зустрічі прямо зараз. Оформи доступ, щоб відкрити чати.</p>
                                <button onClick={handlePayment} class="w-full mt-6 redy-btn text-white font-black py-4 rounded-[20px] shadow-lg shadow-red-500/30 text-lg">
                                    GO (Увійти в клуб)
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'chats' && (
                        <div class="flex-1 flex flex-col justify-center items-center text-gray-400 text-sm bg-white m-4 rounded-[32px] shadow-sm p-6 text-center">
                            <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                                <span class="text-3xl">💬</span>
                            </div>
                            <h3 class="text-xl font-black text-black mb-1">Немає чатів</h3>
                            <p class="font-medium text-gray-500">Відкрий преміум, щоб написати першим.</p>
                        </div>
                    )}

                    <nav class="flex justify-around items-center py-5 bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.03)] rounded-t-[32px] z-10 pb-8">
                        <button onClick={() => setActiveTab('radar')} class={`flex flex-col items-center ${activeTab === 'radar' ? 'text-[#FF0033]' : 'text-gray-400'}`}>
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                            <span class="text-[11px] font-bold mt-1">Радар</span>
                        </button>
                        <button onClick={() => setActiveTab('likes')} class={`flex flex-col items-center ${activeTab === 'likes' ? 'text-[#FF0033]' : 'text-gray-400'}`}>
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span class="text-[11px] font-bold mt-1">Лайки</span>
                        </button>
                        <button onClick={() => setActiveTab('chats')} class={`flex flex-col items-center ${activeTab === 'chats' ? 'text-[#FF0033]' : 'text-gray-400'}`}>
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                            <span class="text-[11px] font-bold mt-1">Чати</span>
                        </button>
                    </nav>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
